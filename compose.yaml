services:
  harness:
    build: ./services/harness
    # --reload is dev-only: the image's default CMD is the prod command without it.
    # --reload-dir: watch only our code, not thousands of dirs in .venv;
    # graceful timeout: an open SSE stream would otherwise block the reload forever
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --timeout-graceful-shutdown 3
    env_file: .env
    ports:
      # loopback only: until auth lands, anyone on the LAN could spend the LLM key
      - "127.0.0.1:8000:8000"
    healthcheck:
      # the slim image has no curl, but python is always there
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    develop:
      watch:
        # sync: copies files into the running container, uvicorn --reload notices the change
        - action: sync
          path: ./services/harness/app
          target: /app/app
        # rebuild: new dependencies = new image, syncing .venv makes no sense
        - action: rebuild
          path: ./services/harness/uv.lock
        - action: rebuild
          path: ./services/harness/pyproject.toml

  # React chat (spec 010): the Vite dev server; it proxies /api/* to harness, so the browser needs no CORS
  webapp:
    build: ./services/webapp
    environment:
      HARNESS_URL: http://harness:8000
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # busybox wget: alpine has no curl; 127.0.0.1 because Vite listens on IPv4 and `localhost` may be ::1
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    develop:
      watch:
        # Vite's HMR sees the synced files and patches the page without a reload
        - action: sync
          path: ./services/webapp/src
          target: /app/src
        - action: rebuild
          path: ./services/webapp/package-lock.json
        - action: rebuild
          path: ./services/webapp/package.json
        - action: rebuild
          path: ./services/webapp/vite.config.ts
        - action: rebuild
          path: ./services/webapp/index.html
