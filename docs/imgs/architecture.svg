      .planned-t { fill: #3c4043; } .planned-s { fill: #5f6368; }
      .edge { fill: none; stroke: #5f6368; stroke-width: 1.5; stroke-linejoin: round; }
      .dashed { stroke-dasharray: 4 4; }
      .pill { fill: #ffffff; stroke: #dadce0; stroke-width: 1; }
      .pill-t { font-size: 12px; fill: #3c4043; text-anchor: middle; }
      .legend { font-size: 12px; fill: #5f6368; }
    </style>
