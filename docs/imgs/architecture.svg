<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 730" width="1220" height="730" role="img" aria-label="harness architecture">
  <title>harness architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; }
      .bg { fill: #ffffff; }
      .frame { fill: #ffffff; stroke: #c8ccd0; stroke-width: 1.2; }
      .frame-title { font-size: 13px; font-weight: 700; fill: #3c4043; }
