[project]
name = "harness"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.1",
    "langchain-deepseek==1.1.1",
    "langchain-mcp-adapters==0.3.2",
    "langgraph==1.2.15",
    "pydantic-settings==2.16.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "httpx2==2.13.1",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.pytest.ini_options]
# app/ isn't installed as a package, so let pytest import it from the service root
pythonpath = ["."]

[tool.ruff.lint]
# defaults (E, F) + import order, pyupgrade, bugbear, simplify
extend-select = ["I", "UP", "B", "SIM"]

[tool.basedpyright]
# "standard" catches real type errors; the default "recommended" also demands annotations on every test param
typeCheckingMode = "standard"
